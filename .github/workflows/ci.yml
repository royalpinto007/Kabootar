name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast, no-Flutter gate: proves the routing engine on the bare Dart SDK.
  engine:
    name: Mesh engine invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Verify mesh routing (32 invariants, dependency-free)
        # Run from a pubspec-free copy so the Flutter pubspec does not trigger
        # package resolution; the harness uses only relative imports + dart:core.
        run: |
          mkdir -p "$RUNNER_TEMP/ec"
          cp -r lib tool "$RUNNER_TEMP/ec/"
          cd "$RUNNER_TEMP/ec" && dart run tool/engine_check.dart

  # Full Flutter gate: analyze + test the app.
  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Unit tests
        run: flutter test
